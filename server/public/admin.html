<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAdvisor — Mentor Dashboard</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif;
          --line: #8884; --met: #2e7d32; --partial: #b26a00; --missed: #c62828; --na: #777; }
  * { box-sizing: border-box; }
  body { max-width: 880px; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
  h1 { font-size: 1.25rem; } h2 { font-size: 1.1rem; margin: 1.2rem 0 .5rem; }
  a { color: inherit; }
  nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid var(--line);
        padding-bottom: .6rem; margin-bottom: 1rem; flex-wrap: wrap; }
  nav .spacer { flex: 1; } nav .who { opacity: .7; font-size: .85em; }
  form.login { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1rem 0; }
  input, textarea, select { padding: .45rem; font-size: 1rem; font-family: inherit;
        border: 1px solid var(--line); border-radius: 6px; background: transparent; }
  textarea { width: 100%; }
  button { padding: .45rem .9rem; font-size: .95rem; cursor: pointer; border-radius: 6px;
           border: 1px solid var(--line); background: transparent; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
  tr.click { cursor: pointer; } tr.click:hover { background: #8881; }
  .badge { display: inline-block; padding: .05rem .5rem; border-radius: 999px;
           font-size: .78em; color: #fff; }
  .badge.met { background: var(--met); } .badge.partial { background: var(--partial); }
  .badge.missed { background: var(--missed); } .badge.na { background: var(--na); }
  .badge.role { background: #555; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: .8rem 1rem; margin: .8rem 0; }
  .muted { opacity: .7; font-size: .88em; }
  .quote { border-left: 3px solid var(--line); margin: .25rem 0 .25rem .5rem;
           padding: .1rem .6rem; font-style: italic; opacity: .9; }
  .tip { font-size: .88em; opacity: .85; margin-left: .5rem; }
  .dimrow { display: flex; gap: 1rem; flex-wrap: wrap; margin: .6rem 0 1rem; }
  .dimcell { min-width: 140px; }
  svg.spark { display: block; }
  #status { color: #c62828; min-height: 1.3em; }
  .ok { color: var(--met); }
  details.raw { margin-top: 1rem; }
  .crit-edit { border-top: 1px dashed var(--line); padding-top: .6rem; margin-top: .6rem; }
  label.f { display: block; margin: .35rem 0; font-size: .88em; opacity: .85; }
</style>
</head>
<body>
<h1>MedAdvisor — Mentor Dashboard</h1>
<section id="auth">
  <form class="login" id="login">
    <input id="email" type="email" placeholder="email" autocomplete="username" required>
    <input id="password" type="password" placeholder="password" autocomplete="current-password" required>
    <button type="submit" class="primary">Sign in</button>
  </form>
</section>
<p id="status"></p>
<section id="app" hidden>
  <nav>
    <a href="#cohort">Cohort</a>
    <a href="#rubrics">Rubrics</a>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button id="signout">Sign out</button>
  </nav>
  <main id="view"></main>
</section>
<script type="module" src="admin.js"></script>
</body>
</html>
