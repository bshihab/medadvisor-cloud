<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedAdvisor — Mentor Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    --blue: #3b82f6; --indigo: #6366f1; --purple: #8b5cf6;
    --accent: var(--indigo);
    --ink: #1e1b2e; --muted: #6b6885;
    --bg: #f6f5fb; --card: #ffffff; --line: #e4e2f0;
    --met: #2e7d32; --partial: #b26a00; --missed: #c62828; --na: #8a8798;
    --shadow: 0 1px 2px rgb(30 27 46 / .05), 0 8px 24px -12px rgb(99 102 241 / .25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #edecf6; --muted: #a5a3bd;
      --bg: #14121f; --card: #1e1b2e; --line: #322e4a;
      --met: #66bb6a; --partial: #ffb74d; --missed: #ef5350;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px -12px rgb(99 102 241 / .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  [hidden] { display: none !important; } /* author display rules must not beat the hidden attr */
  body {
    color: var(--ink); background: var(--bg);
    min-height: 100vh; line-height: 1.5;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(600px 400px at 8% -5%, rgb(59 130 246 / .14), transparent 70%),
      radial-gradient(700px 500px at 105% 15%, rgb(139 92 246 / .13), transparent 70%),
      radial-gradient(500px 400px at 50% 110%, rgb(99 102 241 / .10), transparent 70%);
  }
  h1, h2, h3 { margin: 0 0 .4rem; font-weight: 650; letter-spacing: -.01em; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 1.2rem 1.2rem 4rem; }

  /* ---- login ---- */
  #auth { display: grid; place-items: center; min-height: 100vh; padding: 1rem; }
  .login-card {
    width: min(400px, 92vw); background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 2.2rem 2rem; box-shadow: var(--shadow); text-align: center;
  }
  .brandmark {
    width: 56px; height: 56px; margin: 0 auto 1rem; border-radius: 16px;
    background: linear-gradient(135deg, var(--blue), var(--indigo) 55%, var(--purple));
    display: grid; place-items: center; color: #fff; font-size: 1.6rem; font-weight: 700;
  }
  .login-card h1 { font-size: 1.35rem; }
  .login-card .sub { color: var(--muted); margin: 0 0 1.4rem; font-size: .95rem; }
  .login-card form { display: grid; gap: .7rem; text-align: left; }
  .or { display: flex; align-items: center; gap: .8rem; color: var(--muted);
        font-size: .82rem; margin: .9rem 0; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .gbtn { width: 100%; display: flex; gap: .6rem; align-items: center;
          justify-content: center; font-weight: 500; }

  /* ---- controls ---- */
  input, textarea, select {
    padding: .6rem .75rem; font-size: 1rem; font-family: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100%;
  }
  input:focus, textarea:focus { outline: 2px solid var(--indigo); outline-offset: 1px; border-color: transparent; }
  button {
    padding: .55rem 1rem; font-size: .95rem; font-family: inherit; cursor: pointer;
    border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: inherit;
  }
  button:hover { border-color: var(--indigo); }
  button.primary {
    background: linear-gradient(135deg, var(--blue), var(--indigo) 60%, var(--purple));
    border: none; color: #fff; font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .55; cursor: default; }
  button.danger { color: var(--missed); }
  button.small { padding: .25rem .6rem; font-size: .82rem; border-radius: 8px; }

  /* ---- app shell ---- */
  nav.top {
    display: flex; gap: .4rem; align-items: center; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: .6rem .9rem; margin-bottom: 1.2rem; box-shadow: var(--shadow);
  }
  nav.top .brand { display: flex; gap: .55rem; align-items: center; font-weight: 700; margin-right: .8rem; }
  nav.top .brand .brandmark { width: 30px; height: 30px; border-radius: 9px; margin: 0; font-size: .9rem; }
  nav.top a.tab { padding: .35rem .8rem; border-radius: 999px; color: var(--ink); }
  nav.top a.tab.on { background: color-mix(in srgb, var(--indigo) 14%, transparent); color: var(--accent); font-weight: 600; }
  nav.top a.tab:hover { text-decoration: none; }
  nav.top .spacer { flex: 1; }
  nav.top .who { color: var(--muted); font-size: .85rem; margin-right: .5rem; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 1rem 1.2rem; margin: .9rem 0; box-shadow: var(--shadow);
  }
  table { border-collapse: collapse; width: 100%; }
  th { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: color-mix(in srgb, var(--indigo) 6%, transparent); }

  .badge { display: inline-block; padding: .08rem .55rem; border-radius: 999px; font-size: .76rem; font-weight: 600; color: #fff; }
  .badge.met { background: var(--met); } .badge.partial { background: var(--partial); }
  .badge.missed { background: var(--missed); } .badge.na { background: var(--na); }
  .badge.mentor { background: linear-gradient(135deg, var(--indigo), var(--purple)); }
  .badge.trainee { background: var(--na); }

  .muted { color: var(--muted); font-size: .88em; }
  .quote {
    border-left: 3px solid var(--indigo); margin: .3rem 0 .3rem .4rem;
    padding: .15rem .7rem; font-style: italic; color: var(--muted);
  }
  .tip { font-size: .88em; color: var(--muted); margin-left: .4rem; }
  .dimrow { display: flex; gap: 1.1rem; flex-wrap: wrap; }
  .dimcell { min-width: 132px; }
  /* Unified skill-area rows (spec in PLAN.md): label · bar · percent · trend */
  .skillrow { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(120px, 180px) 3.4rem 60px;
              gap: .8rem; align-items: center; margin: .4rem 0; cursor: pointer;
              border-radius: 8px; padding: .15rem .3rem; }
  .skillrow:hover { background: color-mix(in srgb, var(--indigo) 7%, transparent); }
  .inviterow { display: flex; gap: .7rem; align-items: center; padding: .45rem 0;
               border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .inviterow:last-of-type { border-bottom: none; }
  .mentorinv { color: var(--purple); font-weight: 550; font-size: .9rem; }
  .mintbox { border-top: 2px solid var(--line); margin-top: .8rem; padding-top: .7rem; }
  .skillrow .bar { display: block; height: 10px; border-radius: 999px;
                   background: #88888833; overflow: hidden; }
  .skillrow .bar span { display: block; height: 100%; border-radius: 999px; }
  .skillrow .pct { font-weight: 600; font-variant-numeric: tabular-nums;
                   font-family: ui-monospace, "SF Mono", Menlo, monospace;
                   font-size: .92rem; text-align: right; }
  svg.spark { display: block; }

  .note { border-top: 1px solid var(--line); padding: .6rem 0; }
  .note:first-of-type { border-top: none; }
  .note .meta { color: var(--muted); font-size: .8rem; margin-bottom: .15rem; }
  .composer { display: grid; gap: .5rem; margin-top: .7rem; }
  .composer textarea { min-height: 64px; resize: vertical; }
  .composer .row { display: flex; gap: .5rem; align-items: center; }

  .retraction { text-align: center; font-style: italic; margin: 1rem 0; }
  code { background: color-mix(in srgb, var(--indigo) 10%, transparent);
         padding: .1rem .45rem; border-radius: 6px; font-size: .95em;
         letter-spacing: .06em; }
  .state { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }
  .state .big { font-size: 2rem; margin-bottom: .4rem; }
  .spin {
    width: 26px; height: 26px; margin: 0 auto .6rem; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--indigo);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: var(--missed); min-height: 1.2em; font-size: .92rem; }
  .ok { color: var(--met); }
  details.raw { margin-top: 1rem; }
  .f { display: block; margin: .45rem 0; font-size: .88em; color: var(--muted); }
  .f input, .f textarea { margin-top: .25rem; }
  .crit-edit { border-top: 1px dashed var(--line); padding-top: .6rem; margin-top: .6rem; }
</style>
</head>
<body>
<section id="auth" hidden>
  <div class="login-card">
    <div class="brandmark">M</div>
    <h1>MedAdvisor</h1>
    <p class="sub">Mentor Dashboard</p>
    <form id="login">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="primary" id="loginbtn">Sign in</button>
    </form>
    <div class="or"><span>or</span></div>
    <button id="googlebtn" class="gbtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <p class="err" id="loginerr"></p>
  </div>
</section>
<section id="app" hidden>
  <div class="wrap">
    <nav class="top">
      <span class="brand"><span class="brandmark">M</span> MedAdvisor</span>
      <a href="#cohort" class="tab" data-tab="cohort">Cohort</a>
      <a href="#rubrics" class="tab" data-tab="rubrics">Rubrics</a>
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <button id="signout">Sign out</button>
    </nav>
    <main id="view"></main>
  </div>
</section>
<div id="boot" class="state" style="padding-top:38vh"><div class="spin"></div>Loading…</div>
<script type="module" src="admin.js"></script>
</body>
</html>
